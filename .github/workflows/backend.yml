name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: docscan_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m unittest discover -s tests -v
        env:
          DOCSCAN_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres@127.0.0.1:5432/docscan_ci' || '' }}
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t docscan-ci .
      - run: docker run --detach --name docscan-ci -e PORT=10000 -p 127.0.0.1:10000:10000 docscan-ci
      - run: |
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' docscan-ci)
            if [ "$state" = healthy ]; then break; fi
            if [ "$state" = unhealthy ]; then docker logs docscan-ci; exit 1; fi
            sleep 1
          done
          test "$state" = healthy
          curl --fail http://127.0.0.1:10000/api/v1/health
          curl --fail http://127.0.0.1:10000/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:10000/api/v1/documents)" = 401
      - if: always()
        run: docker logs docscan-ci || true
